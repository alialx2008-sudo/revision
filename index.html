// find the passage sentence that best supports an answer
function evidence(ctx, needle){
  if (!ctx.passage || !needle) return '';

    var ns = norm(s), sc = 0;

function typedItem(card, key, answers, ctx, isB){

// precompute group choice sets for fills without own options
function prep(items){
  var groupStart = 0, groups = {};
  items.forEach(function(it, i){
    if (it.t === 'heading' || it.t === 'sub' || it.t === 'note' || it.t === 'section') groupStart = i;
    if (it.t === 'fill' && it.ans.length === 1 && !/\([^()]+–[^()]+\)\s*$/.test(it.q) && !it.bank){ (groups[groupStart] = groups[groupStart] || []).push(i); }
  });
  var map = {};
  Object.keys(groups).forEach(function(g){
    var idxs = groups[g]; if (idxs.length < 2) return;
    var uniq = []; idxs.forEach(function(i){ var a = items[i].ans[0]; if (!uniq.some(function(u){return norm(u)===norm(a);})) uniq.push(a); });
    if (uniq.length <= 4 && uniq.length < idxs.length) idxs.forEach(function(i){ map[i] = uniq; });
  });
  return map;
}

var claudeDl = null, dlTried = false;
function getDl(){
  if (claudeDl) return Promise.resolve(claudeDl);
  if (!(window.claude && window.claude.use)) return Promise.resolve(null);
  return window.claude.use('downloads').then(function(d){ claudeDl = d; return d; }).catch(function(){ return null; });
}

var SUBFILE = {'arabic-a':'Arabic-A','arabic-b':'Arabic-B','islamic-a':'Islamic-A','islamic-b':'Islamic-B','social':'Social'};
function downloadPdf(R, id, key){
  var url = key ? 'pdf/key/'+id+'.pdf' : R.pdf;
  var name = 'GEMS-Westminster-RAK-' + (SUBFILE[R.subject]||'') + '-' + R.grade + (key ? '-Answer-Key.pdf' : '-Revision.pdf');
  toast('جارٍ تجهيز الملف…');
  getDl().then(function(dl){
    if (!dl){ pdfLink(url, name); return; }
    return fetch(url).then(function(r){ if (!r.ok) throw {code:'http'}; return r.blob(); })
      .then(function(b){ return dl.save({filename:name, data:b}); })
      .then(function(){ toast('تم حفظ الملف'); })
      .catch(function(e){ if (e && e.code==='declined') return; pdfLink(url, name); });
  });
}
function pdfLink(url, name){

  var b = el('div','pdfbox'); b.id='pdfbox';

  var x = el('button','tbtn','إِغْلاقٌ'); x.onclick = function(){ b.remove(); };
  b.appendChild(a); b.appendChild(x); document.body.appendChild(b);
}

var SHEET_URL = '';

function sendRating(d){
  try { var all = load('ratings', []); all.push(d); save('ratings', all.slice(-50)); } catch(e){}
  if (!SHEET_URL) return Promise.resolve('local');
  var body = JSON.stringify(d);
  return fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body}).then(function(){ return 'sent'; })
    .catch(function(){ try { if (navigator.sendBeacon && navigator.sendBeacon(SHEET_URL, new Blob([body], {type:'text/plain'}))) return 'sent'; } catch(e){}
      return 'local'; });
}

  var lk = el('div','yng wrap');
  [['sound','الصَّوْتُ','Sound'],['praise','التَّشْجيعُ','Encouragement'],['explain','الشَّرْحُ','Explanations'],['pics','الصُّوَرُ','Pictures'],['pdf','مِلَفُّ PDF','PDF']].forEach(function(o){ var b = el('button','chip',bi?o[1]+' / '+o[2]:o[1]); b.type='button'; b.setAttribute('aria-pressed','false');

document.getElementById('backBtn').onclick = function(){ var h = location.hash.slice(1); if (h.indexOf('r-')===0 && REV[h.slice(2)]) location.hash = REV[h.slice(2)].subject; else location.hash = ''; };
function route(){
  if ('speechSynthesis' in window) try{ speechSynthesis.cancel(); }catch(e){}
  var h = location.hash.slice(1);
  if (SUBJECTS[h]) viewSubject(h);
  else if (h.indexOf('r-')===0 && REV[h.slice(2)]) viewRevision(h.slice(2));
